name: Mod catalog question or report
description: Ask about the mod PR process or report a broken or potentially malicious listing.
title: "[Mod catalog]: "
labels:
  - mod-submission
body:
  - type: markdown
    attributes:
      value: |
        Mod additions and updates must be submitted as pull requests under `mods/<unique-mod-id>/`. This issue form is for questions or reporting a problem with an existing listing; it does not submit or publish a mod.
  - type: dropdown
    id: request-type
    attributes:
      label: What do you need?
      options:
        - Question about submitting a mod pull request
        - Report a broken mod listing
        - Report a potentially malicious mod
        - Request removal of an existing listing
    validations:
      required: true
  - type: input
    id: mod-id
    attributes:
      label: Mod ID or directory
      description: Link the existing listing if applicable.
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the question or report. Do not include private data or harmful files.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I have not included secrets, private data, or files I do not have permission to share.
          required: true
