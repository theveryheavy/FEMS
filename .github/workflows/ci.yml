name: FEMS checks

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile toolkit
        run: python -m compileall -q modkit
      - name: Check developer CLI help
        run: python modkit/fedk.py --help
      - name: Check public CLI help
        run: python modkit/fems_public.py help
